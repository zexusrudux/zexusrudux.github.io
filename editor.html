<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EDITOR HORIZONTAL</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:#0f0f0f;color:white;font-family:Bangers;height:100vh;width:100vw;display:flex;flex-direction:column}#top{height:48px;background:#ffde59;color:black;display:flex;align-items:center;justify-content:space-between;padding:0 12px}#main{flex:1;display:flex;flex-direction:row;width:100vw;height:calc(100vh - 48px)}@media(orientation:portrait){#main{flex-direction:column}#left{width:100%;height:55%}#right{width:100%;height:45%}}@media(orientation:landscape){#left{width:42%;height:100%;border-right:4px solid #333}#right{width:58%;height:100%}}#left{background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}#px{width:320px;height:480px;max-width:90%;max-height:75vh;border:4px solid white;background:#000;image-rendering:pixelated}#right{background:#111;display:flex;flex-direction:column;padding:8px;overflow-y:auto}.tabs{display:flex;gap:4px}.tab{flex:1;padding:8px;background:#222;border:2px solid #444;text-align:center;font-size:11px;cursor:pointer}.tab.on{background:#ffde59;color:black}.modes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin:8px 0}.mbtn{padding:8px;background:#222;border:2px solid #444;font-size:10px;text-align:center;cursor:pointer}.mbtn.on{border-color:#ffde59;color:#ffde59;background:#333}.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.col{height:38px;border:2px solid white;cursor:pointer}.col.on{border:3px solid #ffde59;transform:scale(1.08)}.btn{flex:1;padding:12px;border:3px solid white;background:#ffde59;color:black;font-family:Bangers;font-size:12px;box-shadow:4px 4px 0 black;cursor:pointer}</style>
</head><body><div id="top"><b>🎨 EDITOR HORIZONTAL 👁️</b><div style="display:flex;gap:6px"><button onclick="location.href='index.html'" style="padding:6px 10px;border:2px solid black;background:white;font-family:Bangers">MENU</button><button onclick="saveAndPlay()" style="padding:6px 14px;border:2px solid black;background:#00ff88;font-family:Bangers">JUGAR →</button></div></div><div id="main"><div id="left"><canvas id="px" width="160" height="240"></canvas><div style="display:flex;gap:4px;align-items:center;margin-top:6px;font-size:10px"><span>PINCEL:</span><button onclick="setBrush(1)" id="b1" style="width:28px;height:28px;border:2px solid white;background:#ffde59;color:black;font-family:Bangers">1</button><button onclick="setBrush(2)" id="b2" style="width:28px;height:28px;border:2px solid white;background:#222;color:white;font-family:Bangers">2</button><span id="curModeTxt" style="margin-left:8px;color:#ffde59">PIEL</span></div></div><div id="right"><div class="tabs"><div class="tab on" id="t_idle" onclick="setF('idle')">IDLE</div><div class="tab" id="t_walk" onclick="setF('walk')">WALK1</div><div class="tab" id="t_walk2" onclick="setF('walk2')">WALK2</div><div class="tab" id="t_atk" onclick="setF('atk')">ATK 🩴</div></div><div class="modes"><div class="mbtn on" id="m_skin" onclick="setM('skin')">🖐️ PIEL</div><div class="mbtn" id="m_shirt" onclick="setM('shirt')">👕 PLAYERA</div><div class="mbtn" id="m_pants" onclick="setM('pants')">👖 PANT</div><div class="mbtn" id="m_hair" onclick="setM('hair')">💇 PELO</div><div class="mbtn" id="m_eyes" onclick="setM('eyes')">👁️ OJOS</div><div class="mbtn" id="m_chancla" onclick="setM('chancla')">🩴 CHANCLA</div><div class="mbtn" onclick="clr()">🧹 BORRAR</div><div class="mbtn" onclick="fill()" style="border-color:#00ff88;color:#00ff88">✨ RELLENAR</div></div><div class="pal" id="pal"></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" onclick="clr()">🧹 BORRAR</button><button class="btn" style="background:#00ff88" onclick="fill()">✨ RELLENAR</button><button class="btn" style="background:#0af;color:white" onclick="saveAndPlay()">💾 GUARDAR</button></div></div></div>
<script src="skin.js"></script><script>
const cvs=document.getElementById('px'),ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
let cols=["#FFDBAC","#D2A679","#8B4513","#ffffff","#000000","#ff0000","#0088ff","#00ff00","#ffde59","#fb8500","#ff2222","#ff88ff","#8B5A2B","#444","#0af","#0f8"];
let curC=cols[0],curM='skin',curF='idle',custom=loadSkin(),brush=1;
let pal=document.getElementById('pal');cols.forEach((c,i)=>{let d=document.createElement('div');d.className='col';d.style.background=c;if(i==0)d.classList.add('on');d.onclick=()=>{curC=c;document.querySelectorAll('.col').forEach(x=>x.classList.remove('on'));d.classList.add('on');};pal.appendChild(d);});
function setM(m){curM=m;document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('on'));let el=document.getElementById('m_'+m);if(el)el.classList.add('on');document.getElementById('curModeTxt').textContent=m.toUpperCase();draw();}
function setF(f){curF=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById('t_'+f).classList.add('on');draw();}
function setBrush(s){brush=s;document.getElementById('b1').style.background=s==1?'#ffde59':'';document.getElementById('b2').style.background=s==2?'#ffde59':'';}
function clr(){custom[curM]={};saveSkin(custom);draw();}function fill(){baseParts[curM].forEach(([x,y])=>custom[curM][`${x},${y}`]=curC);saveSkin(custom);draw();}
function draw(){ctx.fillStyle="#000";ctx.fillRect(0,0,160,240);ctx.strokeStyle="#222";for(let i=0;i<=16;i++){ctx.beginPath();ctx.moveTo(i*10,0);ctx.lineTo(i*10,240);ctx.stroke();}for(let i=0;i<=24;i++){ctx.beginPath();ctx.moveTo(0,i*10);ctx.lineTo(160,i*10);ctx.stroke();}let o=animOffsets[curF];Object.keys(baseParts).forEach(pt=>{let[ox,oy]=o[pt];baseParts[pt].forEach(([x,y])=>{let nx=x+ox,ny=y+oy;if(nx<0||nx>=16||ny<0||ny>=24)return;let key=`${x},${y}`;let col=custom[pt]?.[key]||(pt=='eyes'?"#ffffff":pt=='skin'?"#1a1a1a":"#111");ctx.fillStyle=col;ctx.fillRect(nx*10+1,ny*10+1,8,8);if(curM==pt){ctx.strokeStyle="rgba(255,222,89,0.6)";ctx.strokeRect(nx*10+1,ny*10+1,8,8);}if(pt=='eyes'&&(key=="5,2"||key=="9,2")){ctx.fillStyle="#000";ctx.fillRect(nx*10+3,ny*10+3,4,4);}});});if(curF=='atk'){ctx.fillStyle="#ffde59";ctx.fillRect(120,80,30,10);}}
function pos(e){let r=cvs.getBoundingClientRect();let cx=e.clientX||e.touches[0].clientX,cy=e.clientY||e.touches[0].clientY;return{x:Math.floor((cx-r.left)/r.width*16),y:Math.floor((cy-r.top)/r.height*24)};}
function paintAt(x,y){for(let pt of Object.keys(baseParts)){let[ox,oy]=animOffsets[curF][pt];for(let[bx,by]of baseParts[pt]){if(bx+ox==x&&by+oy==y&&pt==curM){custom[pt][`${bx},${by}`]=curC;if(brush==2){for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){let nx=x+dx,ny=y+dy;for(let[bx2,by2]of baseParts[pt]){let[ox2,oy2]=animOffsets[curF][pt];if(bx2+ox2==nx&&by2+oy2==ny)custom[pt][`${bx2},${by2}`]=curC;}}}}}}}
let down=false,lastTap=0;function handle(e){let{x,y}=pos(e);paintAt(x,y);saveSkin(custom);draw();}
cvs.addEventListener('mousedown',e=>{down=true;handle(e)});cvs.addEventListener('mousemove',e=>{if(down)handle(e)});window.addEventListener('mouseup',()=>down=false);
cvs.addEventListener('touchstart',e=>{e.preventDefault();let now=Date.now();if(now-lastTap<300)fill();lastTap=now;down=true;handle(e.touches[0])},{passive:false});
cvs.addEventListener('touchmove',e=>{e.preventDefault();if(down)handle(e.touches[0])},{passive:false});
cvs.addEventListener('touchend',()=>down=false);
function saveAndPlay(){saveSkin(custom);location.href='game.html';}draw();setBrush(1);
</script></body></html>
