<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KOF LA CHANCLA</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');*{box-sizing:border-box;touch-action:manipulation;user-select:none;margin:0;padding:0}body{background:#0a0a0a;color:white;font-family:Bangers;height:100vh;height:100dvh;overflow:hidden}#main{width:100%;height:100%;display:flex;flex-direction:column}@media(orientation:landscape){#main{flex-direction:row}#left{width:40%;height:100%}#right{width:60%;height:100%}h1{font-size:42px}#skinPreview{width:180px;height:270px}}@media(orientation:portrait){#main{flex-direction:column;overflow-y:auto}#left{width:100%;min-height:58vh;padding:12px}#right{width:100%;min-height:42vh;padding:10px}h1{font-size:36px}#skinPreview{width:140px;height:210px}}#left{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}#right{background:linear-gradient(180deg,#1e1e1e,#000);display:flex;flex-direction:column}h1{color:#ffde59;text-shadow:4px 4px 0 black;line-height:.85;text-align:center}h1 span{color:white;display:block}h1 span.sub{font-size:14px;color:#ffde59;letter-spacing:2px}#skinPreview{border:4px solid white;background:#000;image-rendering:pixelated;box-shadow:6px 6px 0 black}.btn{display:flex;align-items:center;justify-content:center;width:92%;max-width:320px;padding:14px;background:#ffde59;color:black;border:3px solid white;font-size:18px;text-decoration:none;box-shadow:5px 5px 0 black;cursor:pointer;margin:4px 0}.btn:active{transform:translate(4px,4px);box-shadow:0 0 0}.btn2{background:#00ff88}.btn3{background:#0af;color:white}.levels{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;padding:4px}.levelCard{background:#222;border:3px solid #444;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.levelCard.on{border-color:#ffde59;background:#333}.levelCard.locked{opacity:.35;pointer-events:none}.progress{height:8px;background:#000;border:1px solid #555;margin-top:6px}.progFill{height:100%;background:linear-gradient(90deg,#ffde59,#fb8500)}</style>
</head><body><div id="main"><div id="left"><h1>KOF<br><span>LA CHANCLA</span><span class="sub">CON OJOS 👁️</span></h1><canvas id="skinPreview" width="160" height="240"></canvas><a class="btn btn2" href="editor.html">🎨 EDITAR SKIN</a><a class="btn" id="playBtn" href="game.html">🥊 JUGAR</a><div style="width:92%;max-width:320px;background:#222;border:3px solid #444;padding:10px;margin-top:4px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>⚙️ VELOCIDAD</span><span id="speedLabel" style="color:#ffde59">TRANQUI</span></div><input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="0.7" style="width:100%;accent-color:#ffde59"><div style="display:flex;justify-content:space-between;font-size:9px;opacity:.6"><span>🐢 0.5</span><span>1.0</span><span>🔥 2.0</span></div><div style="display:flex;gap:4px;margin-top:6px"><button onclick="setSpeed(0.5)" style="flex:1;padding:6px;border:2px solid #444;background:#222;color:white;font-family:Bangers;font-size:9px">LENTO</button><button onclick="setSpeed(0.7)" style="flex:1;padding:6px;border:2px solid #ffde59;background:#333;color:#ffde59;font-family:Bangers;font-size:9px">TRANQUI</button><button onclick="setSpeed(1.5)" style="flex:1;padding:6px;border:2px solid #444;background:#222;color:white;font-family:Bangers;font-size:9px">TURBO</button></div></div><div id="stats" style="font-size:10px;opacity:.6"></div></div><div id="right"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:18px">📋 NIVELES</b><span id="progressBadge" style="background:#ffde59;color:black;padding:2px 8px;font-size:10px;border:2px solid black">1/3</span></div><div class="levels" id="levels"></div><div style="display:flex;gap:6px;margin-top:8px"><a class="btn3 btn" style="flex:1;font-size:12px;padding:10px" href="editor.html">✏️ EDITOR</a><a class="btn" style="flex:1;font-size:12px;padding:10px;background:#ff2222;color:white" href="game.html">🥊 PELEA</a></div></div></div>
<script src="settings.js"></script><script src="skin.js"></script><script src="levels.js"></script>
<script>
const cvs=document.getElementById('skinPreview'),ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
let custom=JSON.parse(localStorage.getItem('kof_skin_v2')||'{"skin":{},"shirt":{},"pants":{},"hair":{},"chancla":{},"eyes":{}}');
let progress=parseInt(localStorage.getItem('kof_level')||'1');
let settings=loadSettings();
function drawPreview(){ctx.fillStyle="#000";ctx.fillRect(0,0,160,240);let o=animOffsets['idle'];Object.keys(baseParts).forEach(pt=>{let[ox,oy]=o[pt]||[0,0];baseParts[pt].forEach(([x,y])=>{let nx=x+ox,ny=y+oy;let key=`${x},${y}`;let col=custom[pt]?.[key]||(pt=='skin'?"#FFDBAC":pt=='shirt'?"#f44":pt=='pants'?"#222":pt=='hair'?"#5a2d0c":pt=='chancla'?"#ffde59":"#fff");ctx.fillStyle=col;ctx.fillRect(nx*10+1,ny*10+1,8,8);if(pt=='eyes'&&(key=="5,2"||key=="9,2")){ctx.fillStyle="#000";ctx.fillRect(nx*10+3,ny*10+3,4,4);}});});}
drawPreview();
let levelsDiv=document.getElementById('levels');LEVELS.forEach((lvl,i)=>{let unlocked=(i+1)<=progress;let completed=(i+1)<progress;let div=document.createElement('div');div.className='levelCard'+(i+1==progress?' on':'')+(unlocked?'':' locked');div.innerHTML=`<div><b>${lvl.name}</b><br><span style="font-size:10px;opacity:.7">🧱 ${lvl.obstacles.length} • ${lvl.length}px • ${lvl.enemy.name}</span><div class="progress"><div class="progFill" style="width:${completed?100:(i+1==progress?35:0)}%"></div></div></div><div style="font-size:24px">${unlocked?(completed?'✅':'▶️'):'🔒'}</div>`;div.onclick=()=>{if(unlocked){localStorage.setItem('kof_level',lvl.id);document.getElementById('playBtn').textContent='🥊 '+lvl.name;document.querySelectorAll('.levelCard').forEach(c=>c.classList.remove('on'));div.classList.add('on');}};levelsDiv.appendChild(div);});
document.getElementById('progressBadge').textContent=`${progress}/${LEVELS.length}`;document.getElementById('stats').textContent=`NIVEL ${progress} • ${settings.speed}x ${getSpeedLabel(settings.speed)}`;
document.getElementById('playBtn').textContent='🥊 '+getLevel(progress).name;
document.getElementById('speedSlider').value=settings.speed;document.getElementById('speedLabel').textContent=getSpeedLabel(settings.speed);
document.getElementById('speedSlider').addEventListener('input',e=>{let v=parseFloat(e.target.value);settings.speed=v;settings.enemySpeed=v;saveSettings(settings);document.getElementById('speedLabel').textContent=getSpeedLabel(v);document.getElementById('stats').textContent=`NIVEL ${progress} • ${v}x ${getSpeedLabel(v)}`;});
function setSpeed(v){settings.speed=v;settings.enemySpeed=v;saveSettings(settings);document.getElementById('speedSlider').value=v;document.getElementById('speedLabel').textContent=getSpeedLabel(v);document.getElementById('stats').textContent=`NIVEL ${progress} • ${v}x ${getSpeedLabel(v)}`;}
let f=0;setInterval(()=>{f++;ctx.clearRect(0,0,160,240);let frm=f%40<20?'walk':'walk2';let o=animOffsets[frm];Object.keys(baseParts).forEach(pt=>{let[ox,oy]=o[pt];baseParts[pt].forEach(([x,y])=>{let nx=x+ox,ny=y+oy;let key=`${x},${y}`;let col=custom[pt]?.[key]||(pt=='eyes'?"#fff":"#222");ctx.fillStyle=col;ctx.fillRect(nx*10+1,ny*10+1,8,8);if(pt=='eyes'&&(key=="5,2"||key=="9,2")){ctx.fillStyle="#000";ctx.fillRect(nx*10+3,ny*10+3,4,4);}});});},140);
</script></body></html>
