<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KOF HORIZONTAL</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:#000;overflow:hidden;font-family:Bangers}#game{position:fixed;inset:0;width:100vw;height:100vh}#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:6px;z-index:10}.life{width:30%;height:18px;background:#000;border:2px solid white;transform:skew(-8deg)}.fill{height:100%}.levelInfo{position:fixed;top:40px;left:50%;transform:translateX(-50%);background:black;border:2px solid #ffde59;padding:4px 12px;font-size:14px;z-index:10;color:#ffde59;white-space:nowrap}#controls{position:fixed;bottom:0;left:0;right:0;height:36vh;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 20px;z-index:20}.joy{width:120px;height:120px;background:rgba(255,255,255,0.12);border:3px solid #666;border-radius:50%;position:relative}.stick{width:50px;height:50px;background:radial-gradient(#ffde59,#fb8500);border:3px solid white;border-radius:50%;position:absolute;left:35px;top:35px}.bgrid{display:grid;grid-template-columns:64px 64px;gap:12px}.b{width:64px;height:64px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;background:#222;font-size:24px;box-shadow:0 4px 0 black}.b:active{transform:translateY(4px);box-shadow:0 0 0}#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;text-align:center;z-index:30;display:none;text-shadow:4px 4px 0 black}#camInfo{position:fixed;bottom:38vh;left:10px;background:rgba(0,0,0,0.6);border:1px solid #555;padding:4px 8px;font-size:10px;color:white;z-index:10}</style>
</head><body><canvas id="game"></canvas><div id="ui"><div class="life"><div class="fill" id="f1" style="width:100%;background:linear-gradient(90deg,red,yellow)"></div></div><div id="timer" style="background:black;border:2px solid white;padding:2px 10px">99</div><div class="life"><div class="fill" id="f2" style="width:100%;background:linear-gradient(90deg,#0f8,#0af);float:right"></div></div></div><div class="levelInfo" id="levelName">NIVEL 1</div><div id="camInfo"></div><div id="msg"></div><div style="position:fixed;top:40px;left:8px;z-index:20;display:flex;gap:4px"><button onclick="location.href='index.html'" style="padding:6px 10px;border:2px solid white;background:black;color:white;font-family:Bangers">MENU</button><button onclick="let s=loadSettings();s.speed=Math.max(0.5,s.speed-0.2);saveSettings(s);location.reload()" style="padding:6px 8px;border:2px solid white;background:#222;color:white;font-family:Bangers">🐢 -</button><button onclick="let s=loadSettings();s.speed=Math.min(2,s.speed+0.2);saveSettings(s);location.reload()" style="padding:6px 8px;border:2px solid white;background:#ffde59;color:black;font-family:Bangers">+ 🐇</button></div><div id="controls"><div class="joy" id="jb"><div class="stick" id="js"></div></div><div class="bgrid"><div class="b" id="bj">↑</div><div class="b" style="background:#ffde59;color:black" id="ba">🩴</div><div class="b" id="be">💨</div><div class="b" style="background:#f22" id="bs">💥</div></div></div>
<script src="settings.js"></script><script src="skin.js"></script><script src="levels.js"></script>
<script>
const g=document.getElementById('game'),gc=g.getContext('2d');
function resize(){g.width=innerWidth*2;g.height=innerHeight*2;g.style.width=innerWidth+'px';g.style.height=innerHeight+'px';gc.setTransform(2,0,0,2,0,0);}resize();window.addEventListener('resize',resize);
let p1,p2,pts=[],timer=99,over=false,joy={x:0,y:0},curLevel=loadProgress(),levelData=getLevel(curLevel),custom=loadSkin(),camera=0,SET=loadSettings();
document.getElementById('levelName').textContent=levelData.name;g.style.background=levelData.bg;
function mk(x,isP2){return{x,y:innerHeight*0.55,vx:0,vy:0,hp:isP2?levelData.enemy.hp:100,facing:isP2?-1:1,onGround:true,atk:0,spc:0,cd:0,st:'idle',wt:0}}
p1=mk(100,false);p2=mk(levelData.length-200,true);
setInterval(()=>{if(!over&&timer>0){timer--;document.getElementById('timer').textContent=timer;}},1000);
const jb=document.getElementById('jb'),js=document.getElementById('js');
jb.addEventListener('touchstart',e=>{e.preventDefault();mv(e)},{passive:false});jb.addEventListener('touchmove',e=>{e.preventDefault();mv(e)},{passive:false});jb.addEventListener('touchend',()=>{joy.x=0;joy.y=0;js.style.left='35px';js.style.top='35px';});
function mv(e){let t=e.touches[0],r=jb.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);let d=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*d/40;joy.y=Math.sin(a)*d/40;js.style.left=(35+joy.x*35)+'px';js.style.top=(35+joy.y*35)+'px';}
function bind(id,fn){document.getElementById(id).addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});}
bind('ba',()=>{if(p1.atk==0){p1.atk=16;p1.st='atk';if(navigator.vibrate)navigator.vibrate(25);}});bind('bs',()=>{if(p1.spc==0){p1.spc=30;pts.push({x:p1.x+30,y:p1.y+20,vx:p1.facing*10*SET.speed,life:60,own:p1,dmg:22,emoji:"🩴"});}});bind('bj',()=>{if(p1.onGround){p1.vy=-SET.jumpPower;p1.onGround=false;}});bind('be',()=>{p1.vx+=p1.facing*-12*SET.speed;});
function checkPlatform(p){for(let ob of levelData.obstacles){if(p.x+30>ob.x&&p.x<ob.x+ob.w){let platTop=innerHeight*0.65-ob.h;if(p.y+50>=platTop&&p.y+50<=platTop+20&&p.vy>=0){p.y=platTop-50;p.vy=0;p.onGround=true;return true;}if(p.y+20>platTop){if(p.vx>0&&p.x+40>ob.x&&p.x<ob.x){p.x=ob.x-40;p.vx=0;}if(p.vx<0&&p.x<ob.x+ob.w&&p.x>ob.x){p.x=ob.x+ob.w;p.vx=0;}}}}return false;}
function loop(){
let dist=p1.x-p2.x;
if(Math.abs(dist)>80){p2.vx+=dist>0?-levelData.enemy.speed*SET.enemySpeed:levelData.enemy.speed*SET.enemySpeed;p2.facing=dist>0?1:-1;p2.st='walk';p2.wt++;}else{p2.vx*=0.85;p2.st='idle';}
if(Math.abs(dist)<80&&Math.random()<0.08){p2.atk=15;p2.st='atk';if(levelData.enemy.doubleChancla&&p2.spc==0){p2.spc=40;pts.push({x:p2.x-10,y:p2.y+15,vx:p2.facing*8*SET.enemySpeed,life:50,own:p2,dmg:levelData.enemy.damage,emoji:"🩴"});}}
if(Math.abs(joy.x)>0.2){p1.vx+=joy.x*1.5*SET.speed;p1.facing=joy.x>0?1:-1;p1.st='walk';p1.wt++;}else if(p1.atk==0){p1.vx*=0.88;if(p1.onGround)p1.st='idle';}
[p1,p2].forEach(p=>{p.x+=p.vx*SET.speed;p.y+=p.vy;p.vy+=SET.gravity;let floorY=innerHeight*0.65;let onPlat=checkPlatform(p);if(!onPlat){if(p.y>floorY-50){p.y=floorY-50;p.vy=0;p.onGround=true;}}p.x=Math.max(0,Math.min(levelData.length-50,p.x));if(p.atk>0)p.atk--;else if(p.st=='atk')p.st='idle';if(p.spc>0)p.spc--;if(p.cd>0)p.cd--;});
if(p1.atk>8&&Math.abs(p1.x-p2.x)<75&&Math.abs(p1.y-p2.y)<50&&p2.cd==0){p2.hp-=13;p2.cd=20;p2.vx+=p1.facing*9;hit(p2);}
if(p2.atk>8&&Math.abs(p2.x-p1.x)<75&&Math.abs(p2.y-p1.y)<50&&p1.cd==0){p1.hp-=levelData.enemy.damage;p1.cd=20;p1.vx+=p2.facing*9;hit(p1);}
pts.forEach((pt,i)=>{pt.x+=pt.vx;pt.life--;let tar=pt.own==p1?p2:p1;if(Math.abs(pt.x-tar.x)<50&&Math.abs(pt.y-tar.y)<50&&tar.cd==0){tar.hp-=pt.dmg;tar.cd=22;hit(tar);pt.life=0;}if(pt.life<=0)pts.splice(i,1);});
document.getElementById('f1').style.width=p1.hp+'%';document.getElementById('f2').style.width=(p2.hp/levelData.enemy.hp*100)+'%';
camera=p1.x-innerWidth*0.3;camera=Math.max(0,Math.min(camera,levelData.length-innerWidth));
document.getElementById('camInfo').textContent=`${Math.floor(p1.x)}/${levelData.length} | ${getSpeedLabel(SET.speed)} ${SET.speed.toFixed(1)}x`;
if(p1.hp<=0||p2.hp<=0||timer<=0){over=true;let m=document.getElementById('msg');m.style.display='block';if(p1.hp>0&&p2.hp<=0){if(curLevel<LEVELS.length){m.innerHTML=`¡GANASTE!<br><span style='font-size:18px'>${levelData.name}</span><br><span style='font-size:14px'>Siguiente...</span>`;saveProgress(curLevel+1);setTimeout(()=>location.reload(),2000);}else{m.innerHTML=`¡JUEGO COMPLETADO!`;localStorage.setItem('kof_level','1');}}else{m.innerHTML=`PERDISTE<br><span style='font-size:14px'>Toca para reintentar</span>`;m.onclick=()=>{p1.x=100;p1.hp=100;p2.hp=levelData.enemy.hp;p2.x=levelData.length-200;timer=99;over=false;m.style.display='none';};}}
gc.clearRect(0,0,innerWidth*2,innerHeight*2);gc.fillStyle=levelData.floor;gc.fillRect(-camera,innerHeight*0.65,levelData.length,innerHeight);
levelData.obstacles.forEach(ob=>{let sx=ob.x-camera;if(sx>-200&&sx<innerWidth+200){gc.fillStyle=ob.color;gc.fillRect(sx,innerHeight*0.65-ob.h,ob.w,ob.h);gc.fillStyle="rgba(0,0,0,0.3)";gc.fillRect(sx,innerHeight*0.65-ob.h,ob.w,6);gc.fillStyle="white";gc.font="10px Bangers";gc.fillText(ob.type.toUpperCase(),sx+4,innerHeight*0.65-ob.h+14);}});
[p1,p2].forEach(p=>{gc.save();gc.translate(p.x-camera+26,p.y+52);gc.scale(p.facing*3,3);gc.imageSmoothingEnabled=false;let frm=p.st=='atk'?'atk':p.st=='walk'?(p.wt%20<10?'walk':'walk2'):'idle';let o=animOffsets[frm];Object.keys(baseParts).forEach(pt=>{let[ox,oy]=o[pt];baseParts[pt].forEach(([bx,by])=>{let nx=bx+ox,ny=by+oy;let key=`${bx},${by}`;let col=null;if(p==p1){if(custom[pt][key])col=custom[pt][key];else{if(pt=='skin')col="#FFDBAC";if(pt=='shirt')col="#ff4444";if(pt=='pants')col="#222";if(pt=='hair')col="#5a2d0c";if(pt=='chancla')col="#ffde59";if(pt=='eyes')col="#ffffff";}}else{let e=levelData.enemy;if(pt=='skin')col=e.skin;if(pt=='shirt')col=e.shirt;if(pt=='pants')col=e.pants;if(pt=='hair')col=e.hair;if(pt=='chancla')col=e.chancla;if(pt=='eyes')col=e.eyes;}if(col){gc.fillStyle=col;gc.fillRect(nx-8,ny-24,1,1);}if(pt=='eyes'&&(key=="5,2"||key=="9,2")){gc.fillStyle="#000";gc.fillRect(nx-8+p.facing*0.3,ny-24+0.2,0.4,0.4);}});});if(frm=='atk'){gc.fillStyle="#ffde59";gc.fillRect(4,-14,6,2);}gc.restore();});
gc.font="26px serif";pts.forEach(pt=>{gc.fillText(pt.emoji,pt.x-camera,pt.y);});requestAnimationFrame(loop);
}function hit(p){for(let i=0;i<3;i++)pts.push({x:p.x+20,y:p.y+10,vx:(Math.random()-0.5)*6,vy:-3,life:10,emoji:"💥"});if(navigator.vibrate)navigator.vibrate(30);}loop();
</script></body></html>
